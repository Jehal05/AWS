<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" width="1320" height="720">
<style>@font-face{font-family:F;src:url(../src/renewflow/static/fonts/figtree-latin-wght-normal.woff2);font-weight:100 900}
text{font-family:F,'Segoe UI',sans-serif} .t{font-size:16px;font-weight:650;fill:#131a22} .s{font-size:13px;fill:#586574} .l{font-size:13px;font-weight:650;fill:#586574} .c{font-size:12px;fill:#586574}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#131a22"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10 1L1 5L10 9z" fill="#131a22"/></marker></defs>
<rect width="1320" height="720" fill="#fff"/>
<text x="40" y="36" style="font-size:22px;font-weight:700;fill:#131a22">RenewFlow architecture</text>
<rect x="20" y="60" width="200" height="520" rx="14" fill="#f4f6f8" stroke="#e1e6eb"/><text x="36" y="88" class="l">Customer</text><rect x="265" y="60" width="300" height="520" rx="14" fill="#f4f6f8" stroke="#e1e6eb"/><text x="281" y="88" class="l">AWS Communication Developer Services</text><rect x="600" y="60" width="420" height="520" rx="14" fill="#f4f6f8" stroke="#e1e6eb"/><text x="616" y="88" class="l">RenewFlow app (one instance behind CloudFront)</text><rect x="40" y="120" width="160" height="70" rx="10" fill="#fff" stroke="#1baf7a" stroke-width="2"/><text x="120.0" y="160.0" text-anchor="middle" class="t">WhatsApp</text><rect x="40" y="340" width="160" height="70" rx="10" fill="#fff" stroke="#2a78d6" stroke-width="2"/><text x="120.0" y="380.0" text-anchor="middle" class="t">Email</text><rect x="290" y="120" width="250" height="70" rx="10" fill="#fff" stroke="#1baf7a" stroke-width="2"/><text x="405.0" y="151.0" text-anchor="middle" class="t">End User Messaging Social</text><text x="405.0" y="171.0" text-anchor="middle" class="s">SendWhatsAppMessage</text><rect x="290" y="340" width="250" height="70" rx="10" fill="#fff" stroke="#2a78d6" stroke-width="2"/><text x="405.0" y="371.0" text-anchor="middle" class="t">Amazon SES</text><text x="405.0" y="391.0" text-anchor="middle" class="s">SendEmail</text><rect x="290" y="496" width="250" height="64" rx="10" fill="#fff" stroke="#c8d0d9" stroke-width="1.5"/><text x="405.0" y="528.0" text-anchor="middle" class="t">Amazon SNS</text><text x="405.0" y="548.0" text-anchor="middle" class="s">events topic</text><rect x="630" y="120" width="360" height="70" rx="10" fill="#fff" stroke="#131a22" stroke-width="2"/><text x="810.0" y="151.0" text-anchor="middle" class="t">Guardrails on every send</text><text x="810.0" y="171.0" text-anchor="middle" class="s">consent · quiet hours · rate limit · length · no invented prices</text><rect x="630" y="240" width="360" height="90" rx="10" fill="#fff" stroke="#c8d0d9" stroke-width="1.5"/><text x="810.0" y="281.0" text-anchor="middle" class="t">Agent loop</text><text x="810.0" y="301.0" text-anchor="middle" class="s">up to 8 tool steps · every call traced</text><rect x="630" y="370" width="160" height="64" rx="10" fill="#fff" stroke="#c8d0d9" stroke-width="1.5"/><text x="710.0" y="398.0" text-anchor="middle" class="t">Channel scoring</text><text x="710.0" y="418.0" text-anchor="middle" class="s">30-day half-life</text><rect x="830" y="370" width="160" height="64" rx="10" fill="#fff" stroke="#c8d0d9" stroke-width="1.5"/><text x="910.0" y="398.0" text-anchor="middle" class="t">SQLite</text><text x="910.0" y="418.0" text-anchor="middle" class="s">threads · events · traces</text><rect x="630" y="500" width="360" height="56" rx="10" fill="#fff" stroke="#c8d0d9" stroke-width="1.5"/><text x="810.0" y="524.0" text-anchor="middle" class="t">Webhook</text><text x="810.0" y="544.0" text-anchor="middle" class="s">idempotent · secret token · topic allow-list</text><rect x="1080" y="260" width="220" height="70" rx="10" fill="#fff" stroke="#c8d0d9" stroke-width="1.5"/><text x="1190.0" y="291.0" text-anchor="middle" class="t">Amazon Bedrock</text><text x="1190.0" y="311.0" text-anchor="middle" class="s">Converse + tool use</text><rect x="1080" y="370" width="220" height="64" rx="10" fill="#fff" stroke="#c8d0d9" stroke-width="1.5"/><text x="1190.0" y="398.0" text-anchor="middle" class="t">Human handoff queue</text><text x="1190.0" y="418.0" text-anchor="middle" class="s">claims · complaints · unclear</text><rect x="1080" y="500" width="220" height="56" rx="10" fill="#fff" stroke="#c8d0d9" stroke-width="1.5"/><text x="1190.0" y="533.0" text-anchor="middle" class="t">Dashboard</text><path d="M810,240 L810,190" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><path d="M630,145 L540,145" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><text x="585" y="137" text-anchor="middle" class="c">approved</text><path d="M630,172 L578,172 L578,375 L540,375" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><path d="M290,155 L200,155" fill="none" stroke="#1baf7a" stroke-width="2"  marker-end="url(#a)" marker-start="url(#b)"/><path d="M290,375 L200,375" fill="none" stroke="#2a78d6" stroke-width="2"  marker-end="url(#a)" marker-start="url(#b)"/><path d="M290,180 L245,180 L245,528 L290,528" fill="none" stroke="#1baf7a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" /><path d="M290,395 L245,395" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 5"/><path d="M540,528 L630,528" fill="none" stroke="#131a22" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" /><path d="M810,500 L810,330" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><path d="M710,330 L710,370" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><path d="M910,330 L910,370" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><path d="M990,295 L1080,295" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" marker-start="url(#b)"/><text x="1035" y="285" text-anchor="middle" class="c">reasoning</text><path d="M990,315 L1035,315 L1035,402 L1080,402" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><path d="M910,434 L910,470 L1040,470 L1040,528 L1080,528" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><path d="M1190,434 L1190,500" fill="none" stroke="#131a22" stroke-width="2"  marker-end="url(#a)" /><line x1="40" y1="650" x2="100" y2="650" stroke="#131a22" stroke-width="2" marker-end="url(#a)"/><text x="112" y="655" class="s">outbound and internal calls</text><line x1="400" y1="650" x2="460" y2="650" stroke="#131a22" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="472" y="655" class="s">inbound events from customers and providers</text><text x="40" y="700" class="s">WhatsApp opens each renewal with an approved template; replies inside 24 hours are free-form. Payment links and prices come only from tools.</text></svg>